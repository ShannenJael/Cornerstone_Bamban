[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  included_files = ["data/**", "pages/ushers-help-content.html"]

[dev]
  publish = "dist"
  functions = "netlify/functions"
  port = 8888

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "Thu, 01 Jan 1970 00:00:00 GMT"

[[redirects]]
  from = "/php/media-handler.php"
  to = "/.netlify/functions/media-handler"
  status = 200
  force = true

[[redirects]]
  from = "/php/media-handler-unix.php"
  to = "/.netlify/functions/media-handler"
  status = 200
  force = true

[[redirects]]
  from = "/php/missions-handler.php"
  to = "/.netlify/functions/missions-handler"
  status = 200
  force = true

[[redirects]]
  from = "/php/youtube-proxy.php"
  to = "/.netlify/functions/youtube-proxy"
  status = 200
  force = true

[[redirects]]
  from = "/php/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/data/*"
  to = "/.netlify/functions/data-file?path=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/pages/send-email.php"
  to = "/.netlify/functions/send-email"
  status = 200
  force = true

[[redirects]]
